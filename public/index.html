<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f11;
      color: #e2e2e5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      flex: 1;
    }

    #model-select {
      background: #27272a;
      color: #e2e2e5;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
    }

    #model-select:focus { border-color: #6366f1; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-size: 0.7rem;
      color: #71717a;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .msg-bubble {
      background: #27272a;
      color: #e2e2e5;
      border-bottom-left-radius: 4px;
    }

    .msg.error .msg-bubble {
      background: #450a0a;
      color: #fca5a5;
    }

    .cursor::after {
      content: '▍';
      animation: blink 0.7s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #18181b;
      border-top: 1px solid #27272a;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: #27272a;
      color: #e2e2e5;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 140px;
      line-height: 1.5;
    }

    #user-input:focus { border-color: #6366f1; }

    #send-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      align-self: flex-end;
      height: 40px;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #4338ca; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      font-size: 0.75rem;
      color: #71717a;
      padding: 0 16px 8px;
      background: #18181b;
      flex-shrink: 0;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Ollama Chat</h1>
    <select id="model-select">
      <option value="">Loading models…</option>
    </select>
  </header>

  <div id="messages"></div>
  <div id="status"></div>

  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Type a message…"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const modelSelect = document.getElementById('model-select');
    const statusEl = document.getElementById('status');

    let history = [];   // [{role, content}]
    let streaming = false;

    // ── Auto-resize textarea ──────────────────────────────────────────
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    });

    // ── Load models ───────────────────────────────────────────────────
    async function loadModels() {
      setStatus('Connecting to Ollama…');
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const models = (data.models || []).map(m => m.name);
        modelSelect.innerHTML = '';
        if (models.length === 0) {
          modelSelect.innerHTML = '<option value="">No models found</option>';
          setStatus('No models found — pull one with: ollama pull llama3');
          return;
        }
        models.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          modelSelect.appendChild(opt);
        });
        setStatus('');
      } catch (err) {
        modelSelect.innerHTML = '<option value="">Ollama unreachable</option>';
        setStatus(`⚠ ${err.message}`);
      }
    }

    // ── Render helpers ────────────────────────────────────────────────
    function appendMessage(role, content = '') {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'You' : 'Assistant';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = content;

      wrap.appendChild(label);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollBottom();
      return bubble;
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    // ── Send message ──────────────────────────────────────────────────
    async function sendMessage() {
      const text = inputEl.value.trim();
      const model = modelSelect.value;
      if (!text || !model || streaming) return;

      streaming = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      history.push({ role: 'user', content: text });
      appendMessage('user', text);

      const bubble = appendMessage('assistant');
      bubble.classList.add('cursor');
      setStatus('Generating…');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, messages: history }),
        });

        if (!res.ok) {
          const err = await res.json();
          bubble.classList.remove('cursor');
          bubble.textContent = `Error: ${err.error}`;
          bubble.closest('.msg').classList.add('error');
          streaming = false;
          sendBtn.disabled = false;
          setStatus('');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let assistantText = '';
        let buffer = '';
        let streamError = false;

        outer: while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.startsWith('data: ')) continue;
            try {
              const payload = JSON.parse(part.slice(6));
              if (payload.error) throw new Error(payload.error);
              assistantText += payload.token;
              bubble.textContent = assistantText;
              scrollBottom();
              if (payload.done) break outer;
            } catch (e) {
              bubble.classList.remove('cursor');
              bubble.textContent = assistantText || `Stream error: ${e.message}`;
              bubble.closest('.msg').classList.add('error');
              streamError = true;
              break outer;
            }
          }
        }

        bubble.classList.remove('cursor');
        if (!streamError) {
          history.push({ role: 'assistant', content: assistantText });
        }
      } catch (err) {
        bubble.classList.remove('cursor');
        bubble.textContent = `Network error: ${err.message}`;
        bubble.closest('.msg').classList.add('error');
      }

      setStatus('');
      streaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // ── Event listeners ───────────────────────────────────────────────
    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ── Init ──────────────────────────────────────────────────────────
    loadModels();
  </script>
</body>
</html>
